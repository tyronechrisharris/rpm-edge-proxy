name: rpm-edge-proxy

services:
  proxy:
    image: rpm-edge-proxy:2.0.0
    build:
      context: .
      args:
        VERSION: "2.0.0"
    pull_policy: never
    container_name: rpm-edge-proxy
    restart: always
    init: true
    ports:
      - "${RPM_PROXY_BIND_IP:-192.168.2.2}:1600:1600/tcp"
      - "127.0.0.1:9090:9090/tcp"
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 64
    mem_limit: 128m
    mem_reservation: 32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      RPM_PROXY_WATCHDOG_SECONDS: "30"
    volumes:
      - ./config/config.json:/config/config.json:ro
    healthcheck:
      test: ["CMD", "python", "-m", "cas_proxy", "--check", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    stop_grace_period: 15s

networks:
  default:
    name: rpm-edge-proxy-network
